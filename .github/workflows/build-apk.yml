name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # ملاحظة: تم حذف خطوة "Generate Android Project Files" لأنها كانت تعيد كتابة
    # AndroidManifest.xml و MainActivity.java و build.gradle بنسخ مبسطة أثناء البناء،
    # فتضيع الأيقونة الجديدة وميزات التطبيق. الملفات الآن تُبنى كما هي في المستودع.

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Build APK with Gradle Wrapper
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FleetDZ-APK
        path: app/build/outputs/apk/debug/app-debug.apk
